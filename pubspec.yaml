name: baybai
description: "An app for transliterating Baybayin script."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.0.2
  flutter_svg: ^2.2.3
  flutter_dotenv: ^6.0.0
  device_info_plus: ^12.4.0
  flutter_device_imei: ^0.0.5
  geolocator: ^14.0.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/docs/
    - assets/fonts/
    - assets/icons/
    - assets/images/
  fonts:
    - family: Baybayin
      fonts:
        - asset: assets/fonts/NotoSansTagalog-Regular.ttf
  


