name: baybai
description: "An app for transliterating Baybayin script."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.0.2
  flutter_dotenv: ^6.0.0
  device_info_plus: ^12.4.0
  flutter_device_imei: ^0.0.5
  geolocator: ^14.0.2
  http: ^1.6.0
  flutter_bloc: ^9.1.1
  dartz: ^0.10.1
  equatable: ^2.0.7
  hydrated_bloc: ^11.0.0
  get_it: ^9.2.1
  path_provider: ^2.1.5
  flutter_tabler_icons: ^1.43.0
  flutter_custom_tabs: ^2.5.0
  share_plus: ^12.0.2
  flutter_security_checker: ^3.2.1
  camera: ^0.12.0+1
  bottom_sheet: ^4.0.4
  image_picker: ^1.2.1
  tflite_flutter: ^0.12.1
  image: ^4.5.0
  introduction_screen: ^4.0.0
  shared_preferences: ^2.5.5
  loading_animation_widget: ^1.3.0
  fluttertoast: ^9.0.0
  permission_handler: ^11.3.1
  solar_icons: ^0.0.5
  flutter_slidable: ^4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/docs/
    - assets/fonts/
    - assets/images/
    - assets/models/
  fonts:
    - family: Baybayin
      fonts:
        - asset: assets/fonts/NotoSansTagalog-Regular.ttf
